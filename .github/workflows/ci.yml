name: cadence-ci

on:
  push:
    branches: [ main, develop, stage2-local ]
  pull_request:
    branches: [ main, develop, stage2-local ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Cadence.sln
      - name: Build
        run: dotnet build Cadence.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Cadence.sln --configuration Release --no-build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend install
        working-directory: frontend
        run: npm install
      - name: Frontend build
        working-directory: frontend
        run: npm run build
