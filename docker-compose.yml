services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cadence
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: CHANGE_ME_LOCAL_DB_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./src/Cadence.Api
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=cadence;Username=cadence;Password=CHANGE_ME_LOCAL_DB_PASSWORD"
      Jwt__Key: "CHANGE_ME_LOCAL_JWT_KEY_AT_LEAST_32_BYTES_LONG"
      Jwt__Issuer: "Cadence"
      Jwt__Audience: "Cadence.Client"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "5000:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: "http://localhost:5000"
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata: