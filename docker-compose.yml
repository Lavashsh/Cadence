services:
  postgres:
    image: postgres:17-alpine
    container_name: cadence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and configure it}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and configure it}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and configure it}
    ports:
      - "5432:5432"
    volumes:
      - cadence_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cadence_postgres_data:
